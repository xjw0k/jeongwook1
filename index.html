              '<div><label for="admin-edit-role" class="field-label">계정 권한</label><select id="admin-edit-role"' + ((primary || isSelf) ? ' disabled' : '') + ' class="select"><option value="user"' + (am.role === 'user' ? ' selected' : '') + '>일반 사용자</option><option value="admin"' + (am.role === 'admin' ? ' selected' : '') + '>관리자 (모든 권한)</option></select></div>' +
              '<div><label for="admin-edit-password" class="field-label">새 비밀번호 (변경할 때만 입력)</label><input id="admin-edit-password" type="password" value="' + esc(am.password) + '" placeholder="비워두면 기존 비밀번호 유지 (4자 이상)" class="input" /></div>' +
              (am.error ? '<p role="alert" class="alert-err" style="margin:0;">' + esc(am.error) + '</p>' : '') +
              '<div class="modal-foot"><button type="button" data-action="close-admin-edit" class="btn btn-secondary">취소</button><button type="submit" class="btn btn-primary">변경 내용 저장</button></div>' +
            '</form>' +
          '</div>' +
        '</div>';
      }

      return html;
    }

    function render() {
      var app = document.getElementById('app');
      var me = getCurrentUser();
      if (!me) {
        app.innerHTML = renderAuthPage();
        return;
      }

      var impUser = getImpersonatedUser();
      var planner = getActivePlanner();
      var owner = impUser || me;

      if (STATE.activePage === 'focus') {
        app.innerHTML = renderStudyFocusView(planner) + renderModals();
        return;
      }

      var mainContent = '';
      if (STATE.activePage === 'calendar') mainContent = renderCalendarView(planner);
      else if (STATE.activePage === 'school') mainContent = renderSchoolView(planner);
      else if (STATE.activePage === 'study') mainContent = renderStudyView(planner);
      else if (STATE.activePage === 'dday') mainContent = renderDDayView(planner);
      else if (STATE.activePage === 'admin' && me.role === 'admin') mainContent = renderAdminView(me, impUser);
      else mainContent = renderCalendarView(planner);

      app.innerHTML =
        '<div class="shell">' +
          '<div class="sidebar-desktop">' + renderSidebarInner(me, impUser, planner, false) + '</div>' +
          (STATE.mobileSidebarOpen
            ? '<div class="mobile-drawer"><div class="mobile-backdrop" data-action="close-mobile-nav" aria-hidden="true"></div><div class="mobile-panel">' + renderSidebarInner(me, impUser, planner, true) + '</div></div>'
            : '') +
          '<div class="main-wrap">' +
            '<header class="mobile-topbar">' +
              '<button type="button" data-action="open-mobile-nav" aria-label="탐색 메뉴 열기" style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;">' +
                icon('menu', 18) + '<span>' + esc(owner.displayName) + '의 플래너</span>' +
              '</button>' +
              '<button type="button" data-action="open-new-sched" class="btn btn-primary">' + icon('plus', 14) + '<span>일정 추가하기</span></button>' +
            '</header>' +
            (impUser
              ? '<div role="status" class="impersonate-bar"><span>현재 <strong>' + esc(impUser.displayName) + ' (@' + esc(impUser.username) + ')</strong> 계정의 플래너를 관리 중입니다.</span><button type="button" data-action="return-own-planner" class="btn btn-secondary">내 플래너로 돌아가기</button></div>'
              : '') +
            '<main class="page-container">' +
              (STATE.notice
                ? '<div role="status" class="notice-banner"><span>' + esc(STATE.notice) + '</span><button type="button" data-action="dismiss-notice" aria-label="안내 닫기" class="icon-btn">' + icon('x', 14) + '</button></div>'
                : '') +
              mainContent +
            '</main>' +
          '</div>' +
        '</div>' +
        renderModals();
    }

    /* ============================================================
     * 7. Open Modals & Event Handlers
     * ============================================================ */
    function openNewScheduleModal(opts) {
      var o = opts || {};
      var baseDate = o.date || getTodayDateStr();
      STATE.schedModal = {
        mode: 'ai',
        editTarget: null,
        referenceDate: baseDate,
        aiText: '',
        group: o.group || 'study',
        studyCategory: o.studyCategory || 'exam_prep',
        schoolKind: o.schoolKind || 'assignment',
        date: baseDate,
        startTime: '16:00',
        endTime: '17:00',
        lastStart: '16:00',
        lastEnd: '17:00',
        subject: '',
        title: '',
        goal: '',
        notes: '',
        error: null
      };
      render();
      var ta = document.getElementById('ai-schedule-memo');
      if (ta) ta.focus();
    }

    function openEditScheduleModal(group, item) {
      STATE.schedModal = {
        mode: 'manual',
        editTarget: { group: group, id: item.id },
        referenceDate: item.date,
        aiText: '',
        group: group,
        studyCategory: group === 'study' ? item.category : 'exam_prep',
        schoolKind: group === 'school' ? item.kind : 'assignment',
        date: item.date,
        startTime: item.startTime || '',
        endTime: item.endTime || '',
        lastStart: item.startTime || '16:00',
        lastEnd: item.endTime || '17:00',
        subject: group === 'study' ? (item.subjectOrBook || '') : group === 'school' ? (item.subject || '') : '',
        title: item.title || '',
        goal: group === 'study' ? (item.goal || '') : '',
        notes: item.notes || '',
        error: null
      };
      render();
    }

    var appEl = document.getElementById('app');

    /* Delegated click actions */
    appEl.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var act = btn.getAttribute('data-action');
      var me = getCurrentUser();
      var planner = getActivePlanner();

      if (act === 'auth-tab') {
        STATE.authMode = btn.getAttribute('data-mode');
        STATE.authError = null;
        render();
        return;
      }
      if (act === 'demo-login') {
        var demo = DB.users.filter(function (u) { return u.username === 'demo'; })[0];
        if (demo) {
          DB.currentUserId = demo.id;
          saveAll();
          STATE.activePage = 'calendar';
          STATE.impersonatedUserId = null;
          STATE.authError = null;
          render();
        }
        return;
      }
      if (act === 'logout') {
        DB.currentUserId = null;
        saveAll();
        STATE.impersonatedUserId = null;
        STATE.mobileSidebarOpen = false;
        STATE.activePage = 'calendar';
        STATE.notice = null;
        render();
        return;
      }
      if (act === 'open-mobile-nav') { STATE.mobileSidebarOpen = true; render(); return; }
      if (act === 'close-mobile-nav') { STATE.mobileSidebarOpen = false; render(); return; }
      if (act === 'dismiss-notice') { STATE.notice = null; render(); return; }
      if (act === 'admin-notice-close') { STATE.adminNotice = null; render(); return; }

      if (act === 'nav') {
        STATE.activePage = btn.getAttribute('data-page');
        STATE.mobileSidebarOpen = false;
        render();
        return;
      }
      if (act === 'start-focus') {
        STATE.activePage = 'focus';
        STATE.mobileSidebarOpen = false;
        render();
        return;
      }
      if (act === 'exit-focus') {
        STATE.activePage = 'calendar';
        render();
        return;
      }
      if (act === 'focus-go-dday') {
        STATE.activePage = 'dday';
        render();
        return;
      }
      if (act === 'return-own-planner') {
        STATE.impersonatedUserId = null;
        STATE.notice = '내 플래너로 돌아왔습니다.';
        render();
        return;
      }

      /* Calendar actions */
      if (act === 'cal-prev') {
        if (STATE.calMonth === 0) { STATE.calYear -= 1; STATE.calMonth = 11; } else { STATE.calMonth -= 1; }
        render();
        return;
      }
      if (act === 'cal-next') {
        if (STATE.calMonth === 11) { STATE.calYear += 1; STATE.calMonth = 0; } else { STATE.calMonth += 1; }
        render();
        return;
      }
      if (act === 'cal-today') {
        var t = getTodayDateStr();
        var tp = t.split('-').map(Number);
        STATE.calYear = tp[0]; STATE.calMonth = tp[1] - 1; STATE.calSelectedDate = t;
        render();
        return;
      }
      if (act === 'cal-filter') {
        STATE.calFilter = btn.getAttribute('data-filter');
        render();
        return;
      }
      if (act === 'cal-select') {
        STATE.calSelectedDate = btn.getAttribute('data-date');
        render();
        return;
      }
      if (act === 'cal-toggle') {
        var src = btn.getAttribute('data-source');
        var id = btn.getAttribute('data-id');
        if (src === 'general') {
          planner.events.forEach(function (ev) { if (ev.id === id) ev.completed = !ev.completed; });
        } else if (src === 'study') {
          planner.studyItems.forEach(function (st) { if (st.id === id) st.completed = !st.completed; });
        } else if (src === 'school') {
          planner.schoolItems.forEach(function (sc) { if (sc.id === id) sc.status = sc.status === 'done' ? 'upcoming' : 'done'; });
        }
        saveAll(); render();
        return;
      }
      if (act === 'cal-edit') {
        var esrc = btn.getAttribute('data-source');
        var eid = btn.getAttribute('data-id');
        if (esrc === 'general') {
          var ev = planner.events.filter(function (x) { return x.id === eid; })[0];
          if (ev) openEditScheduleModal('general', ev);
        } else if (esrc === 'school') {
          var sc = planner.schoolItems.filter(function (x) { return x.id === eid; })[0];
          if (sc) openEditScheduleModal('school', sc);
        } else if (esrc === 'study') {
          var st = planner.studyItems.filter(function (x) { return x.id === eid; })[0];
          if (st) openEditScheduleModal('study', st);
        }
        return;
      }
      if (act === 'cal-del') {
        var dsrc = btn.getAttribute('data-source');
        var did = btn.getAttribute('data-id');
        if (dsrc === 'general') planner.events = planner.events.filter(function (x) { return x.id !== did; });
        if (dsrc === 'school') planner.schoolItems = planner.schoolItems.filter(function (x) { return x.id !== did; });
        if (dsrc === 'study') planner.studyItems = planner.studyItems.filter(function (x) { return x.id !== did; });
        saveAll(); render();
        return;
      }

      /* New / Edit Schedule Modal actions */
      if (act === 'open-new-sched') {
        STATE.mobileSidebarOpen = false;
        openNewScheduleModal({
          date: btn.getAttribute('data-date') || undefined,
          group: btn.getAttribute('data-group') || undefined,
          schoolKind: btn.getAttribute('data-kind') || undefined,
          studyCategory: btn.getAttribute('data-study-cat') || undefined
        });
        return;
      }
      if (act === 'close-sched-modal') { STATE.schedModal = null; render(); return; }
      if (act === 'sched-mode') {
        STATE.schedModal.mode = btn.getAttribute('data-mode');
        STATE.schedModal.error = null;
        render();
        return;
      }
      if (act === 'sched-group') {
        STATE.schedModal.group = btn.getAttribute('data-group');
        STATE.schedModal.error = null;
        render();
        return;
      }
      if (act === 'sched-study-cat') {
        STATE.schedModal.studyCategory = btn.getAttribute('data-cat');
        STATE.schedModal.error = null;
        render();
        return;
      }
      if (act === 'sched-school-kind') {
        STATE.schedModal.schoolKind = btn.getAttribute('data-kind');
        STATE.schedModal.error = null;
        render();
        return;
      }
      if (act === 'toggle-start-unset') {
        var sm1 = STATE.schedModal;
        sm1.error = null;
        if (sm1.startTime === '') sm1.startTime = sm1.lastStart || '16:00';
        else { sm1.lastStart = sm1.startTime; sm1.startTime = ''; }
        render();
        return;
      }
      if (act === 'toggle-end-unset') {
        var sm2 = STATE.schedModal;
        sm2.error = null;
        if (sm2.endTime === '') sm2.endTime = sm2.lastEnd || '17:00';
        else { sm2.lastEnd = sm2.endTime; sm2.endTime = ''; }
        render();
        return;
      }

      /* School actions */
      if (act === 'school-kind-filter') { STATE.schoolKindFilter = btn.getAttribute('data-kind'); render(); return; }
      if (act === 'edit-school') {
        var sc2 = planner.schoolItems.filter(function (x) { return x.id === btn.getAttribute('data-id'); })[0];
        if (sc2) openEditScheduleModal('school', sc2);
        return;
      }
      if (act === 'del-school') {
        var delSid = btn.getAttribute('data-id');
        planner.schoolItems = planner.schoolItems.filter(function (x) { return x.id !== delSid; });
        saveAll(); render();
        return;
      }
      if (act === 'open-tt-cell') {
        var wd = Number(btn.getAttribute('data-wd'));
        var pr = Number(btn.getAttribute('data-period'));
        var existingSlot = planner.timetable.filter(function (s) { return s.weekday === wd && s.period === pr; })[0];
        var rowDef = normalizeTimetableSchedule(planner.timetableSchedule).filter(function (r) { return r.period === pr; })[0];
        STATE.ttCellModal = {
          weekday: wd,
          period: pr,
          existingId: existingSlot ? existingSlot.id : null,
          subject: existingSlot ? existingSlot.subject : '',
          room: existingSlot ? existingSlot.teacherOrRoom : '',
          startTime: existingSlot ? existingSlot.startTime : (rowDef ? rowDef.startTime : '09:00'),
          endTime: existingSlot ? existingSlot.endTime : (rowDef ? rowDef.endTime : '09:50'),
          error: null
        };
        render();
        return;
      }
      if (act === 'close-tt-cell') { STATE.ttCellModal = null; render(); return; }
      if (act === 'del-tt-cell') {
        var tid = btn.getAttribute('data-id');
        planner.timetable = planner.timetable.filter(function (s) { return s.id !== tid; });
        STATE.ttCellModal = null;
        saveAll(); render();
        return;
      }
      if (act === 'open-tt-schedule') {
        var cur = normalizeTimetableSchedule(planner.timetableSchedule);
        var p1 = cur.filter(function (r) { return r.period === 1; })[0];
        STATE.ttScheduleModal = {
          draft: cur.map(function (r) { return Object.assign({}, r); }),
          firstClassStart: p1 ? p1.startTime : '08:40',
          classMinutes: '50',
          breakMinutes: '10',
          lunchMinutes: '60',
          syncSlots: true,
          error: null
        };
        render();
        return;
      }
      if (act === 'close-tt-schedule') { STATE.ttScheduleModal = null; render(); return; }
      if (act === 'tt-auto-calc') {
        var ts = STATE.ttScheduleModal;
        var brk = ts.breakMinutes.trim() === '' ? 10 : Number(ts.breakMinutes);
        ts.draft = recalculateTimetableTimes({
          firstClassStart: ts.firstClassStart,
          classMinutes: Number(ts.classMinutes) || 50,
          breakMinutes: isNaN(brk) ? 10 : brk,
          lunchMinutes: Number(ts.lunchMinutes) || 60
        });
        ts.error = null;
        render();
        return;
      }
      if (act === 'tt-restore-defaults') {
        STATE.ttScheduleModal.draft = buildDefaultTimetableSchedule();
        STATE.ttScheduleModal.firstClassStart = '08:40';
        STATE.ttScheduleModal.classMinutes = '50';
        STATE.ttScheduleModal.breakMinutes = '10';
        STATE.ttScheduleModal.lunchMinutes = '60';
        STATE.ttScheduleModal.error = null;
        render();
        return;
      }

      /* Study actions */
      if (act === 'study-tab') { STATE.studyTab = btn.getAttribute('data-tab'); render(); return; }
      if (act === 'study-toggle') {
        var sid = btn.getAttribute('data-id');
        planner.studyItems.forEach(function (it) { if (it.id === sid) it.completed = !it.completed; });
        saveAll(); render();
        return;
      }
      if (act === 'edit-study') {
        var st2 = planner.studyItems.filter(function (x) { return x.id === btn.getAttribute('data-id'); })[0];
        if (st2) openEditScheduleModal('study', st2);
        return;
      }
      if (act === 'del-study') {
        var delStId = btn.getAttribute('data-id');
        planner.studyItems = planner.studyItems.filter(function (x) { return x.id !== delStId; });
        saveAll(); render();
        return;
      }

      /* D-Day actions */
      if (act === 'edit-dday') {
        var dd = planner.ddays.filter(function (x) { return x.id === btn.getAttribute('data-id'); })[0];
        if (dd) {
          STATE.editDDayModal = {
            id: dd.id, title: dd.title, targetDate: dd.targetDate,
            category: dd.category || '목표', pinned: Boolean(dd.pinned), error: null
          };
          render();
        }
        return;
      }
      if (act === 'close-edit-dday') { STATE.editDDayModal = null; render(); return; }
      if (act === 'toggle-dday-pin') {
        var pid = btn.getAttribute('data-id');
        planner.ddays.forEach(function (d) { if (d.id === pid) d.pinned = !d.pinned; });
        saveAll(); render();
        return;
      }
      if (act === 'del-dday') {
        var delDid = btn.getAttribute('data-id');
        planner.ddays = planner.ddays.filter(function (d) { return d.id !== delDid; });
        if (planner.primaryDDayId === delDid) planner.primaryDDayId = null;
        saveAll(); render();
        return;
      }

      /* Admin actions */
      if (act === 'admin-edit' && me && me.role === 'admin') {
        var target = DB.users.filter(function (u) { return u.id === btn.getAttribute('data-id'); })[0];
        if (target) {
          STATE.adminEditModal = {
            id: target.id, origUsername: target.username, origDisplayName: target.displayName,
            username: target.username, displayName: target.displayName, role: target.role, password: '', error: null
          };
          render();
        }
        return;
      }
      if (act === 'close-admin-edit') { STATE.adminEditModal = null; render(); return; }
      if (act === 'admin-imp' && me && me.role === 'admin') {
        var impTarget = DB.users.filter(function (u) { return u.id === btn.getAttribute('data-id'); })[0];
        if (impTarget) {
          STATE.impersonatedUserId = impTarget.id;
          STATE.activePage = 'calendar';
          STATE.notice = impTarget.displayName + ' (@' + impTarget.username + ') 계정의 플래너를 관리하고 있습니다.';
          render();
        }
        return;
      }
      if (act === 'admin-del-ask') { STATE.adminConfirmDeleteId = btn.getAttribute('data-id'); render(); return; }
      if (act === 'admin-del-cancel') { STATE.adminConfirmDeleteId = null; render(); return; }
      if (act === 'admin-del-confirm' && me && me.role === 'admin') {
        var tdId = btn.getAttribute('data-id');
        var tUser = DB.users.filter(function (u) { return u.id === tdId; })[0];
        if (tUser) {
          var block = canAdminDeleteUser(me.id, tUser);
          if (block) { STATE.adminError = block; render(); return; }
          DB.users = DB.users.filter(function (u) { return u.id !== tdId; });
          delete DB.plannerByUser[tdId];
          if (STATE.impersonatedUserId === tdId) STATE.impersonatedUserId = null;
          STATE.adminConfirmDeleteId = null;
          STATE.adminNotice = '"' + tUser.displayName + ' (@' + tUser.username + ')" 계정을 삭제했습니다.';
          saveAll(); render();
        }
        return;
      }
      if (act === 'admin-download-html' && me && me.role === 'admin') {
        var buildCleanHtml = function () {
          var clone = document.documentElement.cloneNode(true);
          var appClone = clone.querySelector('#app');
          if (appClone) appClone.innerHTML = '';
          return '<!doctype html>\n' + clone.outerHTML + '\n';
        };
        var saveHtmlFile = function (content) {
          var blob = new Blob([content], { type: 'text/html;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = 'index.html';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          STATE.adminError = null;
          STATE.adminNotice = 'GitHub · Vercel 배포용 index.html 파일을 저장했습니다.';
          render();
        };
        if ((window.location.protocol === 'http:' || window.location.protocol === 'https:') && typeof window.fetch === 'function') {
          window.fetch('./index.html', { cache: 'no-store' })
            .then(function (res) { return res.ok ? res.text() : Promise.reject(new Error('fetch_failed')); })
            .then(function (text) {
              if (text && text.toLowerCase().indexOf('<!doctype html>') !== -1) saveHtmlFile(text);
              else saveHtmlFile(buildCleanHtml());
            })
            .catch(function () {
              saveHtmlFile(buildCleanHtml());
            });
        } else {
          saveHtmlFile(buildCleanHtml());
        }
        return;
      }

      /* Focus stage actions */
      if (act === 'focus-24h') { STATE.focus.use24Hour = btn.getAttribute('data-val') === '1'; render(); return; }
      if (act === 'focus-notepad-tab') { STATE.focus.notepadTab = btn.getAttribute('data-tab'); render(); return; }
      if (act === 'focus-todo-toggle') {
        var qid = btn.getAttribute('data-id');
        planner.quickTodos.forEach(function (q) { if (q.id === qid) q.done = !q.done; });
        saveAll(); render();
        return;
      }
      if (act === 'focus-todo-del') {
        var dqId = btn.getAttribute('data-id');
        planner.quickTodos = planner.quickTodos.filter(function (q) { return q.id !== dqId; });
        saveAll(); render();
        return;
      }
      if (act === 'focus-tool') {
        var tool = btn.getAttribute('data-tool');
        STATE.focus.activeTool = STATE.focus.activeTool === tool ? null : tool;
        render();
        return;
      }
      if (act === 'focus-tool-close') { STATE.focus.activeTool = null; render(); return; }
      if (act === 'timer-preset') {
        var mins = Number(btn.getAttribute('data-mins')) || 25;
        STATE.focus.timerRunning = false;
        STATE.focus.timerFinished = false;
        STATE.focus.timerPreset = mins;
        STATE.focus.timerCustom = String(mins);
        STATE.focus.timerSecondsLeft = mins * 60;
        render();
        return;
      }
      if (act === 'timer-toggle') {
        STATE.focus.timerFinished = false;
        STATE.focus.timerRunning = !STATE.focus.timerRunning;
        render();
        return;
      }
      if (act === 'timer-reset') {
        STATE.focus.timerRunning = false;
        STATE.focus.timerFinished = false;
        STATE.focus.timerSecondsLeft = STATE.focus.timerPreset * 60;
        render();
        return;
      }
      if (act === 'sw-toggle') {
        STATE.focus.swRunning = !STATE.focus.swRunning;
        STATE.focus.swLastTick = STATE.focus.swRunning ? Date.now() : null;
        render();
        return;
      }
      if (act === 'sw-lap') {
        if (STATE.focus.swElapsedMs > 0) STATE.focus.swLaps.unshift(STATE.focus.swElapsedMs);
        render();
        return;
      }
      if (act === 'sw-reset') {
        STATE.focus.swRunning = false;
        STATE.focus.swElapsedMs = 0;
        STATE.focus.swLastTick = null;
        STATE.focus.swLaps = [];
        render();
        return;
      }
      if (act === 'calc-key') {
        STATE.focus.calc = applyCalculatorKey(STATE.focus.calc, btn.getAttribute('data-key'));
        render();
        return;
      }
    });

    /* Delegated change events (selects & checkboxes & date/time inputs) */
    appEl.addEventListener('change', function (e) {
      var el = e.target;
      var planner = getActivePlanner();
      var act = el.getAttribute('data-action');

      if (act === 'school-status') {
        var id = el.getAttribute('data-id');
        planner.schoolItems.forEach(function (it) { if (it.id === id) it.status = el.value; });
        saveAll(); render();
        return;
      }
      if (act === 'focus-primary-dday') {
        planner.primaryDDayId = el.value || null;
        saveAll(); render();
        return;
      }
      if (el.id === 'dday-date') STATE.ddayForm.targetDate = el.value;
      if (el.id === 'dday-category') STATE.ddayForm.category = el.value;
      if (el.id === 'dday-pinned') STATE.ddayForm.pinned = el.checked;

      if (STATE.schedModal) {
        if (el.id === 'schedule-date') STATE.schedModal.date = el.value;
        if (el.id === 'schedule-start') { STATE.schedModal.startTime = el.value; if (el.value) STATE.schedModal.lastStart = el.value; }
        if (el.id === 'schedule-end') { STATE.schedModal.endTime = el.value; if (el.value) STATE.schedModal.lastEnd = el.value; }
      }
      if (STATE.editDDayModal) {
        if (el.id === 'edit-dday-date') STATE.editDDayModal.targetDate = el.value;
        if (el.id === 'edit-dday-cat') STATE.editDDayModal.category = el.value;
        if (el.id === 'edit-dday-pinned') STATE.editDDayModal.pinned = el.checked;
      }
      if (STATE.ttCellModal) {
        if (el.id === 'tt-start') STATE.ttCellModal.startTime = el.value;
        if (el.id === 'tt-end') STATE.ttCellModal.endTime = el.value;
      }
      if (STATE.ttScheduleModal) {
        if (el.id === 'tt-sync-slots') STATE.ttScheduleModal.syncSlots = el.checked;
        if (el.hasAttribute('data-tt-row')) {
          var p = Number(el.getAttribute('data-tt-row'));
          var fld = el.getAttribute('data-field');
          STATE.ttScheduleModal.draft.forEach(function (r) { if (r.period === p) r[fld] = el.value; });
        }
      }
      if (STATE.adminEditModal && el.id === 'admin-edit-role') {
        STATE.adminEditModal.role = el.value;
      }
    });

    /* Delegated input events (preserving IME & cursor focus!) */
    var memoSaveTimeout = null;
    appEl.addEventListener('input', function (e) {
      var el = e.target;
      var id = el.id;

      if (id === 'auth-username') STATE.authUsername = el.value;
      else if (id === 'auth-displayname') STATE.authDisplayName = el.value;
      else if (id === 'auth-password') STATE.authPassword = el.value;
      else if (id === 'dday-title') STATE.ddayForm.title = el.value;
      else if (id === 'focus-todo-input') STATE.focus.newTodoText = el.value;
      else if (id === 'focus-timer-custom-input') STATE.focus.timerCustom = el.value;
      else if (id === 'cal-search-input') {
        STATE.calSearch = el.value;
        var calRoot = document.getElementById('cal-split-root');
        if (calRoot) calRoot.innerHTML = renderCalendarSplitMarkup(getActivePlanner());
      } else if (id === 'admin-search-input') {
        STATE.adminSearch = el.value;
        var tbody = document.getElementById('admin-tbody');
        if (tbody) tbody.innerHTML = renderAdminTableMarkup(getCurrentUser(), getImpersonatedUser());
      } else if (id === 'focus-memo-textarea') {
        var planner = getActivePlanner();
        planner.studyMemo = el.value;
        STATE.focus.memoStatus = 'saving';
        var stEl = document.getElementById('focus-memo-status');
        if (stEl) stEl.textContent = '저장 중...';
        if (memoSaveTimeout) window.clearTimeout(memoSaveTimeout);
        memoSaveTimeout = window.setTimeout(function () {
          saveAll();
          STATE.focus.memoStatus = 'saved';
          var stEl2 = document.getElementById('focus-memo-status');
          if (stEl2) stEl2.textContent = '방금 저장됨';
        }, 200);
      } else if (STATE.schedModal) {
        if (id === 'ai-schedule-memo') STATE.schedModal.aiText = el.value;
        else if (id === 'schedule-subject') STATE.schedModal.subject = el.value;
        else if (id === 'schedule-goal') STATE.schedModal.goal = el.value;
        else if (id === 'schedule-title') STATE.schedModal.title = el.value;
        else if (id === 'schedule-notes') STATE.schedModal.notes = el.value;
      } else if (STATE.editDDayModal && id === 'edit-dday-title') {
        STATE.editDDayModal.title = el.value;
      } else if (STATE.ttCellModal) {
        if (id === 'tt-subject') STATE.ttCellModal.subject = el.value;
        else if (id === 'tt-room') STATE.ttCellModal.room = el.value;
      } else if (STATE.ttScheduleModal) {
        if (id === 'calc-first-start') STATE.ttScheduleModal.firstClassStart = el.value;
        else if (id === 'calc-class-min') STATE.ttScheduleModal.classMinutes = el.value;
        else if (id === 'calc-break-min') STATE.ttScheduleModal.breakMinutes = el.value;
        else if (id === 'calc-lunch-min') STATE.ttScheduleModal.lunchMinutes = el.value;
      } else if (STATE.adminEditModal) {
        if (id === 'admin-edit-displayname') STATE.adminEditModal.displayName = el.value;
        else if (id === 'admin-edit-username') STATE.adminEditModal.username = el.value;
        else if (id === 'admin-edit-password') STATE.adminEditModal.password = el.value;
      }
    });

    /* Delegated submit events */
    appEl.addEventListener('submit', function (e) {
      e.preventDefault();
      var formId = e.target.id;
      var planner = getActivePlanner();
      var me = getCurrentUser();

      if (formId === 'auth-form') {
        var uName = STATE.authUsername.trim();
        var pw = STATE.authPassword;
        if (!uName) { STATE.authError = '아이디를 입력해 주세요.'; render(); return; }
        if (!pw) { STATE.authError = '비밀번호를 입력해 주세요.'; render(); return; }

        if (STATE.authMode === 'login') {
          var found = DB.users.filter(function (u) { return u.username.toLowerCase() === uName.toLowerCase(); })[0];
          if (!found || hashStringWithSalt(pw, found.passwordSalt) !== found.passwordHash) {
            STATE.authError = '아이디 또는 비밀번호가 올바르지 않습니다.';
            render();
            return;
          }
          DB.currentUserId = found.id;
          saveAll();
          STATE.activePage = 'calendar';
          STATE.authError = null;
          STATE.authPassword = '';
          render();
        } else {
          var uErr = validateUsername(uName);
          if (uErr) { STATE.authError = uErr; render(); return; }
          var pErr = validatePassword(pw, true);
          if (pErr) { STATE.authError = pErr; render(); return; }
          var dup = DB.users.filter(function (u) { return u.username.toLowerCase() === uName.toLowerCase(); })[0];
          if (dup) { STATE.authError = '이미 사용 중인 아이디입니다.'; render(); return; }
          var dName = STATE.authDisplayName.trim() || uName;
          var salt = uid('salt');
          var newUser = {
            id: uid('user'),
            username: uName,
            displayName: dName,
            role: isPrimaryAdminUsername(uName) ? 'admin' : 'user',
            passwordSalt: salt,
            passwordHash: hashStringWithSalt(pw, salt),
            createdAt: new Date().toISOString()
          };
          DB.users.push(newUser);
          DB.plannerByUser[newUser.id] = emptyPlannerData();
          DB.currentUserId = newUser.id;
          saveAll();
          STATE.activePage = 'calendar';
          STATE.authError = null;
          STATE.authPassword = '';
          render();
        }
        return;
      }

      if (formId === 'sched-ai-form') {
        var txt = (STATE.schedModal.aiText || '').trim();
        if (!txt) {
          STATE.schedModal.error = '빈 메모장에 추가할 일정을 자유롭게 적어주세요.';
          render();
          return;
        }
        var parsed = parseKoreanScheduleMemo(txt, STATE.schedModal.referenceDate, planner.timetableSchedule);
        var nowIso = new Date().toISOString();
        var addedD = 0, addedS = 0, lastDate = null;

        parsed.ddays.forEach(function (dd) {
          planner.ddays.push({
            id: uid('dd'),
            title: dd.title,
            targetDate: dd.targetDate,
            category: dd.category,
            pinned: dd.pinned,
            createdAt: nowIso
          });
          addedD++;
        });

        parsed.schedules.forEach(function (sc) {
          lastDate = sc.date;
          if (sc.scheduleGroup === 'school') {
            planner.schoolItems.push({
              id: uid('sc'),
              kind: sc.schoolKind,
              subject: sc.subject,
              title: sc.title,
              date: sc.date,
              startTime: sc.startTime,
              endTime: sc.endTime,
              status: 'upcoming',
              notes: sc.notes,
              createdAt: nowIso
            });
          } else if (sc.scheduleGroup === 'study') {
            planner.studyItems.push({
              id: uid('st'),
              category: sc.studyCategory,
              subjectOrBook: sc.subject,
              title: sc.title,
              date: sc.date,
              startTime: sc.startTime,
              endTime: sc.endTime,
              goal: sc.goal,
              notes: sc.notes,
              completed: false,
              createdAt: nowIso
            });
          } else {
            planner.events.push({
              id: uid('ev'),
              title: sc.title,
              date: sc.date,
              startTime: sc.startTime,
              endTime: sc.endTime,
              notes: sc.notes,
              completed: false,
              createdAt: nowIso
            });
          }
          addedS++;
        });

        if (lastDate) {
          var lp = lastDate.split('-').map(Number);
          STATE.calYear = lp[0]; STATE.calMonth = lp[1] - 1; STATE.calSelectedDate = lastDate;
        }
        if (addedD > 0 && addedS === 0) STATE.activePage = 'dday';

        var parts = [];
        if (addedS > 0) parts.push('일정 ' + addedS + '건(캘린더)');
        if (addedD > 0) parts.push('D-Day ' + addedD + '건(D-Day 관리)');
        STATE.notice = 'AI가 메모를 분석해 ' + parts.join(' 및 ') + '을 저장했습니다.';
        STATE.schedModal = null;
        saveAll(); render();
        return;
      }

      if (formId === 'sched-manual-form') {
        var sm = STATE.schedModal;
        var vErr = validateScheduleForm({
          title: sm.title, date: sm.date, startTime: sm.startTime, endTime: sm.endTime,
          scheduleGroup: sm.group, subject: sm.group === 'school' ? sm.subject : undefined
        });
        if (vErr) { sm.error = vErr; render(); return; }

        if (sm.editTarget) {
          var eid = sm.editTarget.id;
          if (sm.editTarget.group === 'study') {
            planner.studyItems.forEach(function (it) {
              if (it.id === eid) {
                it.category = sm.studyCategory;
                it.subjectOrBook = sm.subject.trim();
                it.title = sm.title.trim();
                it.date = sm.date;
                it.startTime = sm.startTime;
                it.endTime = sm.endTime;
                it.goal = sm.goal.trim();
                it.notes = sm.notes.trim();
              }
            });
          } else if (sm.editTarget.group === 'school') {
            planner.schoolItems.forEach(function (it) {
              if (it.id === eid) {
                it.kind = sm.schoolKind;
                it.subject = sm.subject.trim();
                it.title = sm.title.trim();
                it.date = sm.date;
                it.startTime = sm.startTime;
                it.endTime = sm.endTime;
                it.notes = sm.notes.trim();
              }
            });
          } else {
            planner.events.forEach(function (it) {
              if (it.id === eid) {
                it.title = sm.title.trim();
                it.date = sm.date;
                it.startTime = sm.startTime;
                it.endTime = sm.endTime;
                it.notes = sm.notes.trim();
              }
            });
          }
          STATE.notice = '일정을 수정했습니다.';
        } else {
          var cIso = new Date().toISOString();
          if (sm.group === 'study') {
            planner.studyItems.push({
              id: uid('st'), category: sm.studyCategory, subjectOrBook: sm.subject.trim(),
              title: sm.title.trim(), date: sm.date, startTime: sm.startTime, endTime: sm.endTime,
              goal: sm.goal.trim(), notes: sm.notes.trim(), completed: false, createdAt: cIso
            });
          } else if (sm.group === 'school') {
            planner.schoolItems.push({
              id: uid('sc'), kind: sm.schoolKind, subject: sm.subject.trim(),
              title: sm.title.trim(), date: sm.date, startTime: sm.startTime, endTime: sm.endTime,
              status: 'upcoming', notes: sm.notes.trim(), createdAt: cIso
            });
          } else {
            planner.events.push({
              id: uid('ev'), title: sm.title.trim(), date: sm.date,
              startTime: sm.startTime, endTime: sm.endTime, notes: sm.notes.trim(),
              completed: false, createdAt: cIso
            });
          }
          STATE.calSelectedDate = sm.date;
          var sp = sm.date.split('-').map(Number);
          STATE.calYear = sp[0]; STATE.calMonth = sp[1] - 1;
          STATE.notice = '새 일정을 캘린더에 저장했습니다.';
        }
        STATE.schedModal = null;
        saveAll(); render();
        return;
      }

      if (formId === 'dday-add-form') {
        var df = STATE.ddayForm;
        var dErr = validateDDayForm({ title: df.title, targetDate: df.targetDate });
        if (dErr) { df.error = dErr; render(); return; }
        planner.ddays.push({
          id: uid('dd'),
          title: df.title.trim(),
          targetDate: df.targetDate,
          category: df.category || '목표',
          pinned: Boolean(df.pinned),
          createdAt: new Date().toISOString()
        });
        df.title = '';
        df.error = null;
        saveAll(); render();
        return;
      }

      if (formId === 'edit-dday-form') {
        var dm = STATE.editDDayModal;
        var deErr = validateDDayForm({ title: dm.title, targetDate: dm.targetDate });
        if (deErr) { dm.error = deErr; render(); return; }
        planner.ddays.forEach(function (d) {
          if (d.id === dm.id) {
            d.title = dm.title.trim();
            d.targetDate = dm.targetDate;
            d.category = dm.category || '목표';
            d.pinned = Boolean(dm.pinned);
          }
        });
        STATE.editDDayModal = null;
        STATE.notice = 'D-Day를 수정했습니다.';
        saveAll(); render();
        return;
      }

      if (formId === 'tt-cell-form') {
        var cm = STATE.ttCellModal;
        if (!cm.subject.trim()) { cm.error = '과목 또는 활동명을 입력해 주세요.'; render(); return; }
        var tErr = validateScheduleTimes(cm.startTime, cm.endTime);
        if (tErr) { cm.error = tErr; render(); return; }
        var existing = planner.timetable.filter(function (s) { return s.weekday === cm.weekday && s.period === cm.period; })[0];
        if (existing) {
          existing.subject = cm.subject.trim();
          existing.teacherOrRoom = cm.room.trim();
          existing.startTime = cm.startTime;
          existing.endTime = cm.endTime;
        } else {
          planner.timetable.push({
            id: uid('tt'), weekday: cm.weekday, period: cm.period,
            subject: cm.subject.trim(), teacherOrRoom: cm.room.trim(),
            startTime: cm.startTime, endTime: cm.endTime
          });
        }
        STATE.ttCellModal = null;
        saveAll(); render();
        return;
      }

      if (formId === 'tt-sched-form') {
        var ts = STATE.ttScheduleModal;
        var tsErr = validateTimetableSchedule(ts.draft);
        if (tsErr) { ts.error = tsErr; render(); return; }
        planner.timetableSchedule = ts.draft.map(function (r) { return Object.assign({}, r); });
        if (ts.syncSlots) {
          var byP = {};
          ts.draft.forEach(function (r) { byP[r.period] = r; });
          planner.timetable.forEach(function (sl) {
            if (byP[sl.period]) {
              sl.startTime = byP[sl.period].startTime;
              sl.endTime = byP[sl.period].endTime;
            }
          });
        }
        STATE.ttScheduleModal = null;
        STATE.notice = '수업 시작 시간 설정을 저장했습니다.';
        saveAll(); render();
        return;
      }

      if (formId === 'admin-edit-form' && me && me.role === 'admin') {
        var am = STATE.adminEditModal;
        var target = DB.users.filter(function (u) { return u.id === am.id; })[0];
        if (!target) return;
        var nextU = am.username.trim();
        var nextD = am.displayName.trim();
        var err = validateUsername(nextU);
        if (!err && isPrimaryAdminUsername(target.username) && !isPrimaryAdminUsername(nextU)) {
          err = '기본 관리자 계정의 아이디는 변경할 수 없습니다.';
        }
        if (!err) err = validateDisplayName(nextD);
        if (!err) err = canAdminChangeRole(me.id, target, am.role);
        if (!err) err = validatePassword(am.password, false);
        if (!err) {
          var dupUser = DB.users.filter(function (u) { return u.id !== target.id && u.username.toLowerCase() === nextU.toLowerCase(); })[0];
          if (dupUser) err = '이미 다른 계정이 사용 중인 아이디입니다.';
        }
        if (err) { am.error = err; render(); return; }

        target.username = nextU;
        target.displayName = nextD;
        target.role = am.role;
        if (am.password) {
          target.passwordSalt = uid('salt');
          target.passwordHash = hashStringWithSalt(am.password, target.passwordSalt);
        }
        STATE.adminNotice = '"' + target.displayName + ' (@' + target.username + ')" 계정 정보를 저장했습니다.';
        STATE.adminEditModal = null;
        saveAll(); render();
        return;
      }

      if (formId === 'focus-todo-form') {
        var txtTodo = STATE.focus.newTodoText.trim();
        if (!txtTodo) return;
        planner.quickTodos.push({ id: uid('qt'), text: txtTodo, done: false });
        STATE.focus.newTodoText = '';
        saveAll(); render();
        return;
      }

      if (formId === 'focus-timer-custom-form') {
        var parsedM = Math.max(1, Math.min(240, Number(STATE.focus.timerCustom) || 25));
        STATE.focus.timerRunning = false;
        STATE.focus.timerFinished = false;
        STATE.focus.timerPreset = parsedM;
        STATE.focus.timerCustom = String(parsedM);
        STATE.focus.timerSecondsLeft = parsedM * 60;
        render();
        return;
      }
    });

    /* Live Focus Intervals (Non-destructive DOM updates) */
    window.setInterval(function () {
      if (STATE.activePage !== 'focus') return;
      var now = new Date();
      var lt = formatLiveTime(now, STATE.focus.use24Hour);
      var clk = document.getElementById('focus-live-clock');
      var per = document.getElementById('focus-live-period');
      var dtEl = document.getElementById('focus-live-date');
      if (clk) clk.textContent = lt.main;
      if (per) {
        per.textContent = lt.period;
        per.style.display = lt.period ? '' : 'none';
      }
      if (dtEl) dtEl.textContent = formatKoreanDateFull(getTodayDateStr());

      if (STATE.focus.timerRunning) {
        if (STATE.focus.timerSecondsLeft <= 1) {
          STATE.focus.timerRunning = false;
          STATE.focus.timerSecondsLeft = 0;
          STATE.focus.timerFinished = true;
          render();
        } else {
          STATE.focus.timerSecondsLeft -= 1;
          var tDisp = document.getElementById('focus-timer-display');
          if (tDisp) tDisp.textContent = formatTimerClock(STATE.focus.timerSecondsLeft);
        }
      }
    }, 1000);

    window.setInterval(function () {
      if (STATE.activePage !== 'focus' || !STATE.focus.swRunning) return;
      var nowMs = Date.now();
      var delta = nowMs - (STATE.focus.swLastTick || nowMs);
      STATE.focus.swLastTick = nowMs;
      STATE.focus.swElapsedMs += delta;
      var swEl = document.getElementById('focus-sw-display');
      if (swEl) swEl.textContent = formatStopwatchClock(STATE.focus.swElapsedMs);
    }, 100);

    /* Initial Boot */
    render();
  })();
  </script>
</body>
</html>
