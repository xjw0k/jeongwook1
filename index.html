<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>노트 스터디 플래너</title>
  <meta name="description" content="학습 워크스페이스 — 캘린더, D-Day, 학교 시간표, 공부 일정 및 집중 타이머" />
  <meta property="og:title" content="노트 스터디 플래너" />
  <meta property="og:description" content="학습 워크스페이스 — 캘린더, D-Day, 학교 시간표, 공부 일정 및 집중 타이머" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #fbfbfa;
      --bg-sidebar: #f7f7f5;
      --bg-hover: #efefed;
      --bg-active: #eaeae6;
      --border: #e9e9e7;
      --border-strong: #d3d1cb;
      --text: #37352f;
      --text-secondary: #5a5852;
      --text-muted: #787774;
      --text-faint: #9b9a97;
      --blue: #2383e2;
      --blue-hover: #1b6ec2;
      --blue-soft: #eef6fd;
      --blue-border: #c9e0f7;
      --orange: #d9730d;
      --orange-text: #b85d06;
      --orange-soft: #fdf5ec;
      --green: #0f7b6c;
      --green-soft: #ecf6f4;
      --red: #e03e3e;
      --red-soft: #fdf2f2;
      --red-border: #f8d7da;
      --font-sans: "Plus Jakarta Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: var(--font-sans);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; padding: 0; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    a { color: inherit; text-decoration: none; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .tabular { font-variant-numeric: tabular-nums; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    /* Shared form inputs & buttons */
    .input, .select, .textarea {
      width: 100%;
      padding: 8px 11px;
      font-size: 13px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      transition: border-color 0.15s, background-color 0.15s;
    }
    .input-sm { padding: 6px 8px; font-size: 12px; }
    .input:focus, .select:focus, .textarea:focus {
      outline: none;
      border-color: var(--blue);
      background: #fff;
    }
    .input-icon-wrap { position: relative; }
    .input-icon-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-faint);
      pointer-events: none;
    }
    .input-icon-wrap .input { padding-left: 32px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 5px;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-md { padding: 9px 16px; font-size: 13.5px; }
    .btn-full { width: 100%; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--blue-hover); }
    .btn-secondary { background: #fff; border-color: var(--border); color: var(--text); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-sidebar); }
    .btn-subtle { background: var(--bg-sidebar); border-color: var(--border); color: var(--text); }
    .btn-subtle:hover:not(:disabled) { background: var(--bg-hover); }
    .btn-dark { background: var(--text); color: #fff; }
    .btn-soft-blue { background: var(--blue-soft); border-color: var(--blue-border); color: var(--blue); }
    .btn-soft-blue:hover:not(:disabled) { background: #e4effc; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger-ghost { color: var(--red); }
    .btn-danger-ghost:hover:not(:disabled) { background: var(--red-soft); }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border-radius: 4px;
      color: var(--text-faint);
      transition: background-color 0.15s, color 0.15s;
    }
    .icon-btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); }
    .icon-btn.edit:hover:not(:disabled) { background: var(--blue-soft); color: var(--blue); }
    .icon-btn.del:hover:not(:disabled) { background: var(--red-soft); color: var(--red); }

    .alert-err {
      font-size: 12px;
      color: var(--red);
      background: var(--red-soft);
      border: 1px solid var(--red-border);
      border-radius: 5px;
      padding: 8px 12px;
    }
    .notice-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: #1b4b7a;
      background: #f5f9fe;
      border: 1px solid var(--blue-border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 20px;
    }

    .seg-tabs {
      display: grid;
      gap: 4px;
      padding: 3px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .seg-tabs.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .seg-tabs.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .seg-tabs-inline {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 3px;
      padding: 3px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .seg-tab {
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 4px;
      color: var(--text-muted);
      white-space: nowrap;
      text-align: center;
      border: 1px solid transparent;
      transition: background-color 0.15s, color 0.15s;
    }
    .seg-tab:hover { color: var(--text); }
    .seg-tab.active {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    /* Auth View */
    .auth-page { min-height: 100vh; background: var(--bg-subtle); display: flex; flex-direction: column; }
    .auth-header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
    }
    .brand-mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .brand-logo {
      width: 24px; height: 24px; border-radius: 4px;
      background: var(--text); color: #fff;
      font-size: 12px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }
    .auth-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: center;
    }
    @media (min-width: 1024px) {
      .auth-grid { grid-template-columns: 1fr 1fr; gap: 48px; }
    }
    .auth-kicker { font-size: 12px; font-weight: 500; color: var(--text-muted); margin: 0 0 8px; }
    .auth-title { font-size: clamp(28px, 4vw, 36px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 10px; }
    .auth-sub { font-size: 15px; color: var(--text-muted); margin: 0; }
    .auth-bullets {
      list-style: none; margin: 24px 0 0; padding: 16px 0 0;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 10px;
      font-size: 14px; color: var(--text-secondary);
    }
    .auth-bullets li { display: flex; align-items: center; gap: 10px; }
    .auth-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
    }
    .auth-field { margin-bottom: 14px; }
    .field-label { display: block; font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .auth-divider { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }

    /* Workspace Shell */
    .shell { min-height: 100vh; display: flex; background: #fff; }
    .sidebar-desktop { display: none; height: 100vh; position: sticky; top: 0; flex-shrink: 0; }
    @media (min-width: 1024px) { .sidebar-desktop { display: block; } }
    .sidebar {
      width: 264px;
      height: 100%;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .sidebar-head {
      padding: 14px 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .avatar-sq {
      width: 24px; height: 24px; border-radius: 4px;
      background: var(--text); color: #fff;
      font-size: 12px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sidebar-actions { padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-nav { flex: 1; overflow-y: auto; }
    .sidebar-sec { padding: 8px 8px 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
    .sidebar-sec-head {
      padding: 2px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 5px;
      text-align: left;
      color: var(--text-secondary);
      transition: background-color 0.15s, color 0.15s;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text); }
    .nav-item.active { background: var(--bg-active); color: var(--text); }
    .nav-item-title { font-size: 13.5px; line-height: 1.3; font-weight: 500; }
    .nav-item.active .nav-item-title { font-weight: 600; }
    .nav-item-sub { font-size: 11px; color: var(--text-muted); }
    .dday-pin-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      text-align: left;
    }
    .dday-pin-row:hover { background: var(--bg-hover); }
    .sidebar-foot { padding: 12px; border-top: 1px solid var(--border); }

    .mobile-drawer { position: fixed; inset: 0; z-index: 40; display: flex; }
    @media (min-width: 1024px) { .mobile-drawer { display: none; } }
    .mobile-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.28); }
    .mobile-panel { position: relative; z-index: 50; height: 100%; }

    .main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .mobile-topbar {
      position: sticky; top: 0; z-index: 30;
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    @media (min-width: 1024px) { .mobile-topbar { display: none; } }
    .impersonate-bar {
      background: #f5f9fe;
      border-bottom: 1px solid var(--blue-border);
      padding: 10px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: #1b4b7a;
    }
    .page-container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 24px 20px 40px; }
    @media (min-width: 640px) { .page-container { padding: 32px 32px 48px; } }
    @media (min-width: 1024px) { .page-container { padding: 36px 40px 48px; } }

    .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .page-title { font-size: clamp(22px, 3vw, 30px); font-weight: 700; letter-spacing: -0.02em; margin: 0; }
    .page-sub { font-size: 13.5px; color: var(--text-muted); margin: 4px 0 0; }

    /* Calendar View */
    .cal-summary {
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }
    .cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; font-size: 11.5px; }
    .cal-legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; flex-shrink: 0; }
    .dot-school { background: var(--orange); }
    .dot-study { background: var(--green); }
    .dot-general { background: var(--blue); }

    .cal-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .cal-split { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; }
    @media (min-width: 1200px) { .cal-split { grid-template-columns: 2fr 1fr; } }
    .cal-grid-wrap { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #fff; }
    .cal-weekdays, .cal-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .cal-weekdays { background: var(--bg-subtle); border-bottom: 1px solid var(--border); }
    .cal-wd { padding: 8px 4px; text-align: center; font-size: 12px; font-weight: 500; border-right: 1px solid var(--border); color: var(--text-muted); }
    .cal-wd:last-child { border-right: none; }
    .cal-cell {
      min-height: 104px;
      padding: 6px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: #fff;
      min-width: 0;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell.last-row { border-bottom: none; }
    .cal-cell.out-month { background: rgba(251,251,250,0.65); color: var(--text-faint); }
    .cal-cell:hover { background: var(--bg-subtle); }
    .cal-cell.selected { background: #f5f9fe; box-shadow: inset 0 0 0 1px var(--blue); }
    .cal-day-num {
      width: 24px; height: 24px; border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500;
    }
    .cal-day-num.today { background: var(--red); color: #fff; font-weight: 600; }
    .cal-pill {
      padding: 2px 6px; border-radius: 3px; font-size: 11px; line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%;
    }
    .cal-pill.school { background: var(--orange-soft); color: var(--orange-text); }
    .cal-pill.study { background: var(--green-soft); color: var(--green); }
    .cal-pill.general { background: var(--blue-soft); color: var(--blue-hover); }
    .cal-pill.done { background: var(--bg-sidebar); color: var(--text-faint); text-decoration: line-through; }

    .inspector {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-subtle);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    /* Tables */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
    table.planner-table { width: 100%; min-width: 680px; border-collapse: collapse; text-align: left; }
    table.planner-table th {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }
    table.planner-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
    table.planner-table tbody tr:last-child td { border-bottom: none; }
    table.planner-table tbody tr:hover { background: var(--bg-subtle); }

    /* Study cards */
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
    .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (min-width: 640px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

    /* Modals */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(0,0,0,0.32);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      width: 100%; max-width: 540px; max-height: 92vh; overflow-y: auto;
      background: #fff; border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 16px 40px rgba(0,0,0,0.14);
    }
    .modal-box.sm { max-width: 440px; }
    .modal-box.lg { max-width: 600px; }
    .modal-head {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .modal-foot { padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

    /* Compact non-overlapping date/time grid in Schedule Modal */
    .date-time-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 600px) {
      .date-time-row { grid-template-columns: minmax(0, 146px) minmax(0, 1fr) minmax(0, 1fr); }
    }
    .dt-label-row { height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-bottom: 6px; }
    .dt-label-row label { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; }
    .unset-chip {
      padding: 2px 6px; font-size: 11px; font-weight: 500;
      border-radius: 4px; border: 1px solid var(--border);
      background: var(--bg-sidebar); color: var(--text-secondary);
      white-space: nowrap; flex-shrink: 0;
    }
    .unset-chip.active { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
    .unset-placeholder {
      width: 100%; padding: 7px 10px; font-size: 12px; text-align: left;
      color: var(--text-muted); background: var(--bg-sidebar);
      border: 1px dashed var(--border-strong); border-radius: 5px;
    }

    /* Fullscreen Study Focus Stage */
    .focus-stage {
      position: fixed; inset: 0; z-index: 45;
      background: #000; color: #f5f5f5;
      overflow-y: auto; display: flex; flex-direction: column;
    }
    .focus-head {
      padding: 20px 28px 12px;
      display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px;
    }
    .focus-grid {
      flex: 1; min-height: 0;
      padding: 8px 28px 24px;
      display: grid; grid-template-columns: 1fr; gap: 28px; align-items: stretch;
    }
    @media (min-width: 1024px) { .focus-grid { grid-template-columns: 310px 1fr; } }
    .focus-box { background: #111; border: 1px solid #262626; border-radius: 6px; }
    .focus-input {
      width: 100%; padding: 7px 10px; font-size: 12px;
      background: #181818; border: 1px solid #2c2c2c; border-radius: 4px; color: #f5f5f5;
    }
    .focus-input:focus { outline: none; border-color: #529cca; }
    .focus-tool-btn {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 5px; border: 1px solid #262626;
      background: #121212; color: #d4d4d4;
    }
    .focus-tool-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .calc-btn {
      padding: 7px 4px; font-size: 12px; font-weight: 500;
      border-radius: 4px; border: 1px solid #262626;
      background: #141414; color: #f5f5f5;
    }
    .calc-btn:hover { background: #202020; }
    .calc-btn.span2 { grid-column: span 2; }
    .calc-btn.fn { background: #1a1a1a; border-color: #2a2a2a; color: #a3a3a3; }
    .calc-btn.op { background: #172638; border-color: #263f5c; color: #7cc0ff; }

        return '아이디는 공백 없이 2~24자로 입력해 주세요.';
      }
      return null;
    }

    function validateDisplayName(raw) {
      var d = String(raw || '').trim();
      if (d.length < 1 || d.length > 30) {
        return '닉네임은 1~30자로 입력해 주세요.';
      }
      return null;
    }

    function validatePassword(raw, required) {
      if (!raw && required === false) return null;
      if (!raw || raw.length < 4) {
        return '비밀번호는 최소 4자 이상이어야 합니다.';
      }
      return null;
    }

    function canAdminChangeRole(actingAdminId, targetUser, nextRole) {
      if (nextRole !== 'admin' && isPrimaryAdminUsername(targetUser.username)) {
        return '기본 관리자 계정의 권한은 해제할 수 없습니다.';
      }
      if (nextRole !== 'admin' && targetUser.id === actingAdminId) {
        return '현재 로그인한 본인 계정의 관리자 권한은 스스로 해제할 수 없습니다.';
      }
      return null;
    }

    function canAdminDeleteUser(actingAdminId, targetUser) {
      if (targetUser.id === actingAdminId) return '현재 로그인한 본인 계정은 삭제할 수 없습니다.';
      if (isPrimaryAdminUsername(targetUser.username)) return '기본 관리자 계정은 삭제할 수 없습니다.';
      return null;
    }

    function formatLocalDate(dt) {
      return dt.getFullYear() + '-' +
        String(dt.getMonth() + 1).padStart(2, '0') + '-' +
        String(dt.getDate()).padStart(2, '0');
    }

    function getTodayDateStr() {
      return formatLocalDate(new Date());
    }

    function parseDateUTC(dateStr) {
      var p = dateStr.split('-').map(Number);
      return Date.UTC(p[0], p[1] - 1, p[2]);
    }

    function formatKoreanDateFull(dateStr) {
      if (!DATE_RE.test(dateStr)) return dateStr || '';
      var p = dateStr.split('-').map(Number);
      var dt = new Date(p[0], p[1] - 1, p[2]);
      var names = ['일', '월', '화', '수', '목', '금', '토'];
      return p[0] + '년 ' + p[1] + '월 ' + p[2] + '일 (' + names[dt.getDay()] + ')';
    }

    function calculateDDay(targetDateStr, refDateStr) {
      var diffDays = Math.round((parseDateUTC(targetDateStr) - parseDateUTC(refDateStr)) / 86400000);
      if (diffDays === 0) return { diffDays: 0, label: 'D-Day', isToday: true, isPast: false };
      if (diffDays > 0) return { diffDays: diffDays, label: 'D-' + diffDays, isToday: false, isPast: false };
      return { diffDays: diffDays, label: 'D+' + Math.abs(diffDays), isToday: false, isPast: true };
    }

    function sortDDaysByProximity(ddays, refDateStr) {
      return ddays.slice().sort(function (a, b) {
        var da = calculateDDay(a.targetDate, refDateStr);
        var db = calculateDDay(b.targetDate, refDateStr);
        if (da.isPast !== db.isPast) return da.isPast ? 1 : -1;
        if (!da.isPast) return da.diffDays - db.diffDays;
        return db.diffDays - da.diffDays;
      });
    }

    function buildCalendarMonthGrid(year, monthZero, todayStr) {
      var firstDay = new Date(year, monthZero, 1);
      var startWeekday = firstDay.getDay();
      var daysInMonth = new Date(year, monthZero + 1, 0).getDate();
      var totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
      var cells = [];
      for (var i = 0; i < totalCells; i++) {
        var dt = new Date(year, monthZero, 1 - startWeekday + i);
        var dateStr = formatLocalDate(dt);
        cells.push({
          dateStr: dateStr,
          dayOfMonth: dt.getDate(),
          inCurrentMonth: dt.getMonth() === monthZero && dt.getFullYear() === year,
          isToday: dateStr === todayStr
        });
      }
      return cells;
    }

    function mergeCalendarItems(events, schoolItems, studyItems, filter, searchQuery) {
      var merged = [];
      var i;
      if (filter === 'all' || filter === 'general') {
        for (i = 0; i < events.length; i++) {
          var ev = events[i];
          merged.push({
            id: 'general-' + ev.id,
            sourceId: ev.id,
            sourceType: 'general',
            subLabel: '일반 일정',
            title: ev.title,
            date: ev.date,
            startTime: ev.startTime,
            endTime: ev.endTime,
            completed: Boolean(ev.completed),
            notes: ev.notes || ''
          });
        }
      }
      if (filter === 'all' || filter === 'school') {
        for (i = 0; i < schoolItems.length; i++) {
          var sc = schoolItems[i];
          merged.push({
            id: 'school-' + sc.id,
            sourceId: sc.id,
            sourceType: 'school',
            subLabel: SCHOOL_KIND_LABELS[sc.kind] || '학교 일정',
            title: sc.subject ? '[' + sc.subject + '] ' + sc.title : sc.title,
            date: sc.date,
            startTime: sc.startTime,
            endTime: sc.endTime,
            completed: sc.status === 'done',
            notes: sc.notes || '',
            subjectLabel: sc.subject
          });
        }
      }
      if (filter === 'all' || filter === 'study') {
        for (i = 0; i < studyItems.length; i++) {
          var st = studyItems[i];
          merged.push({
            id: 'study-' + st.id,
            sourceId: st.id,
            sourceType: 'study',
            subLabel: STUDY_CATEGORY_LABELS[st.category] || '공부 일정',
            title: st.subjectOrBook ? st.subjectOrBook + ' · ' + st.title : st.title,
            date: st.date,
            startTime: st.startTime,
            endTime: st.endTime,
            completed: Boolean(st.completed),
            notes: st.notes || '',
            subjectLabel: st.subjectOrBook
          });
        }
      }
      var q = String(searchQuery || '').trim().toLowerCase();
      var filtered = q
        ? merged.filter(function (item) {
            return (
              item.title.toLowerCase().indexOf(q) !== -1 ||
              item.subLabel.toLowerCase().indexOf(q) !== -1 ||
              item.notes.toLowerCase().indexOf(q) !== -1
            );
          })
        : merged;

      return filtered.sort(function (a, b) {
        if (a.date !== b.date) return a.date.localeCompare(b.date);
        return (a.startTime || '').localeCompare(b.startTime || '');
      });
    }

    function formatScheduleTimeRange(startTime, endTime) {
      var s = String(startTime || '').trim();
      var e = String(endTime || '').trim();
      if (!s && !e) return '시간 미정';
      if (s && !e) return s + '~';
      if (!s && e) return '~' + e;
      if (s === e) return s;
      return s + '–' + e;
    }

    function validateDateString(date) {
      if (!DATE_RE.test(date)) return '올바른 날짜(YYYY-MM-DD)를 선택해 주세요.';
      var p = date.split('-').map(Number);
      var check = new Date(p[0], p[1] - 1, p[2]);
      if (check.getFullYear() !== p[0] || check.getMonth() !== p[1] - 1 || check.getDate() !== p[2]) {
        return '존재하지 않는 날짜입니다.';
      }
      return null;
    }

    function validateScheduleTimes(startTime, endTime) {
      if (startTime && !TIME_RE.test(startTime)) return '시작 시간을 HH:MM 형식으로 입력해 주세요.';
      if (endTime && !TIME_RE.test(endTime)) return '종료 시간을 HH:MM 형식으로 입력해 주세요.';
      if (startTime && endTime && endTime < startTime) return '종료 시간은 시작 시간보다 빠를 수 없습니다.';
      return null;
    }

    function validateScheduleForm(input) {
      if (!String(input.title || '').trim()) return '일정 제목이나 내용을 입력해 주세요.';
      var dErr = validateDateString(input.date);
      if (dErr) return dErr;
      var tErr = validateScheduleTimes(input.startTime, input.endTime);
      if (tErr) return tErr;
      if (input.scheduleGroup === 'school' && !String(input.subject || '').trim()) {
        return '학교 일정의 과목명을 입력해 주세요.';
      }
      return null;
    }

    function validateDDayForm(input) {
      if (!String(input.title || '').trim()) return 'D-Day 목표 이름을 입력해 주세요.';
      return validateDateString(input.targetDate);
    }

    function getTimetableRowLabel(period) {
      for (var i = 0; i < TIMETABLE_ROWS.length; i++) {
        if (TIMETABLE_ROWS[i].period === period) return TIMETABLE_ROWS[i].label;
      }
      return period + '교시';
    }

    function normalizeTimetableSchedule(saved) {
      var byPeriod = {};
      if (Array.isArray(saved)) {
        for (var i = 0; i < saved.length; i++) {
          var item = saved[i];
          if (item && TIME_RE.test(item.startTime) && TIME_RE.test(item.endTime)) {
            byPeriod[item.period] = item;
          }
        }
      }
      return TIMETABLE_ROWS.map(function (row) {
        var found = byPeriod[row.period];
        return found
          ? { period: row.period, startTime: found.startTime, endTime: found.endTime }
          : { period: row.period, startTime: row.defaultStart, endTime: row.defaultEnd };
      });
    }

    function timeToMinutes(hhmm) {
      var p = hhmm.split(':').map(Number);
      return p[0] * 60 + p[1];
    }

    function minutesToTime(mins) {
      var clamped = Math.max(0, Math.min(23 * 60 + 59, Math.round(mins)));
      return String(Math.floor(clamped / 60)).padStart(2, '0') + ':' + String(clamped % 60).padStart(2, '0');
    }

    function recalculateTimetableTimes(params) {
      var classMins = Math.max(15, Math.min(180, Math.round(params.classMinutes || 50)));
      var breakMins = Math.max(0, Math.min(60, Math.round(isNaN(params.breakMinutes) ? 10 : params.breakMinutes)));
      var lunchMins = Math.max(20, Math.min(180, Math.round(params.lunchMinutes || 60)));
      var cursor = TIME_RE.test(params.firstClassStart) ? timeToMinutes(params.firstClassStart) : timeToMinutes('08:40');
      var res = [];
      var p;
      for (p = 1; p <= 4; p++) {
        res.push({ period: p, startTime: minutesToTime(cursor), endTime: minutesToTime(cursor + classMins) });
        cursor += classMins + (p < 4 ? breakMins : 0);
      }
      res.push({ period: 0, startTime: minutesToTime(cursor), endTime: minutesToTime(cursor + lunchMins) });
      cursor += lunchMins;
      for (p = 5; p <= 7; p++) {
        res.push({ period: p, startTime: minutesToTime(cursor), endTime: minutesToTime(cursor + classMins) });
        cursor += classMins + breakMins;
      }
      var afterEnd = cursor + 90;
      res.push({ period: 8, startTime: minutesToTime(cursor), endTime: minutesToTime(afterEnd) });
      var nightStart = afterEnd + 60;
      res.push({ period: 9, startTime: minutesToTime(nightStart), endTime: minutesToTime(nightStart + 150) });
      return res;
    }

    function validateTimetableSchedule(schedule) {
      for (var i = 0; i < schedule.length; i++) {
        var row = schedule[i];
        if (!TIME_RE.test(row.startTime) || !TIME_RE.test(row.endTime)) {
          return getTimetableRowLabel(row.period) + ': 시작 및 종료 시간을 HH:MM 형식으로 입력해 주세요.';
        }
        var err = validateScheduleTimes(row.startTime, row.endTime);
        if (err) return getTimetableRowLabel(row.period) + ': ' + err;
      }
      return null;
    }

    /* Study Tools Helpers */
    function formatTimerClock(totalSeconds) {
      var c = Math.max(0, Math.floor(totalSeconds));
      var hrs = Math.floor(c / 3600);
      var mins = Math.floor((c % 3600) / 60);
      var secs = c % 60;
      if (hrs > 0) {
        return String(hrs).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
      }
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function formatStopwatchClock(elapsedMs) {
      var c = Math.max(0, Math.floor(elapsedMs));
      var totalSeconds = Math.floor(c / 1000);
      var tenths = Math.floor((c % 1000) / 100);
      var hrs = Math.floor(totalSeconds / 3600);
      var mins = Math.floor((totalSeconds % 3600) / 60);
      var secs = totalSeconds % 60;
      if (hrs > 0) {
        return String(hrs).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + '.' + tenths;
      }
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0') + '.' + tenths;
    }

    function formatLiveTime(dt, use24Hour) {
      var h24 = dt.getHours();
      var mins = String(dt.getMinutes()).padStart(2, '0');
      var secs = String(dt.getSeconds()).padStart(2, '0');
      if (use24Hour) return { main: String(h24).padStart(2, '0') + ':' + mins + ':' + secs, period: '' };
      var period = h24 < 12 ? '오전' : '오후';
      var h12 = h24 % 12 === 0 ? 12 : h24 % 12;
      return { main: String(h12).padStart(2, '0') + ':' + mins + ':' + secs, period: period };
    }

    function pickRepresentativeDDay(ddays, primaryDDayId, refDateStr) {
      if (!ddays || ddays.length === 0) return null;
      if (primaryDDayId) {
        for (var i = 0; i < ddays.length; i++) {
          if (ddays[i].id === primaryDDayId) return ddays[i];
        }
      }
      var sorted = sortDDaysByProximity(ddays, refDateStr);
      for (var j = 0; j < sorted.length; j++) {
        if (sorted[j].pinned && !calculateDDay(sorted[j].targetDate, refDateStr).isPast) return sorted[j];
      }
      for (var k = 0; k < sorted.length; k++) {
        if (!calculateDDay(sorted[k].targetDate, refDateStr).isPast) return sorted[k];
      }
      return sorted[0];
    }

    function createCalculatorState() {
      return { display: '0', accumulator: null, pendingOp: null, waitingForNextOperand: false, expression: '', error: false };
    }

    var CALC_OP_SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };

    function applyCalculatorKey(st, key) {
      if (key === 'C') return createCalculatorState();
      if (st.error) {
        if (/^[0-9]$/.test(key)) {
          var fresh = createCalculatorState();
          fresh.display = key;
          return fresh;
        }
        return st;
      }
      if (/^[0-9]$/.test(key)) {
        if (st.waitingForNextOperand) {
          return Object.assign({}, st, { display: key, waitingForNextOperand: false });
        }
        var nextD = st.display === '0' ? key : st.display.length < 14 ? st.display + key : st.display;
        return Object.assign({}, st, { display: nextD });
      }
      if (key === '.') {
        if (st.waitingForNextOperand) return Object.assign({}, st, { display: '0.', waitingForNextOperand: false });
        if (st.display.indexOf('.') !== -1) return st;
        return Object.assign({}, st, { display: st.display + '.' });
      }
      if (key === 'BACK') {
        if (st.waitingForNextOperand) return st;
        if (st.display.length <= 1 || (st.display.length === 2 && st.display.charAt(0) === '-')) {
          return Object.assign({}, st, { display: '0' });
        }
        return Object.assign({}, st, { display: st.display.slice(0, -1) });
      }
      if (key === '%') {
        var v = Number(st.display);
        if (isNaN(v)) return st;
        return Object.assign({}, st, { display: String(Math.round((v / 100) * 1e9) / 1e9) });
      }
      function bin(l, op, r) {
        if (op === '+') return l + r;
        if (op === '-') return l - r;
        if (op === '*') return l * r;
        if (op === '/') return r === 0 ? null : l / r;
        return r;
      }
      if (key === '+' || key === '-' || key === '*' || key === '/') {
        var iv = Number(st.display);
        if (st.accumulator !== null && st.pendingOp && !st.waitingForNextOperand) {
          var res = bin(st.accumulator, st.pendingOp, iv);
          if (res === null) return Object.assign(createCalculatorState(), { display: '0으로 나눌 수 없음', error: true });
          var fmt = String(Math.round(res * 1e9) / 1e9);
          return { display: fmt, accumulator: res, pendingOp: key, waitingForNextOperand: true, expression: fmt + ' ' + CALC_OP_SYM[key], error: false };
        }
        var fmtIv = String(Math.round(iv * 1e9) / 1e9);
        return Object.assign({}, st, { accumulator: iv, pendingOp: key, waitingForNextOperand: true, expression: fmtIv + ' ' + CALC_OP_SYM[key] });
      }
      if (key === '=') {
        if (st.accumulator === null || !st.pendingOp) return st;
        var rv = Number(st.display);
        var r2 = bin(st.accumulator, st.pendingOp, rv);
        if (r2 === null) return Object.assign(createCalculatorState(), { display: '0으로 나눌 수 없음', error: true });
        return {
          display: String(Math.round(r2 * 1e9) / 1e9),
          accumulator: null,
          pendingOp: null,
          waitingForNextOperand: true,
          expression: String(Math.round(st.accumulator * 1e9) / 1e9) + ' ' + CALC_OP_SYM[st.pendingOp] + ' ' + String(Math.round(rv * 1e9) / 1e9) + ' =',
          error: false
        };
      }
      return st;
    }

    /* ============================================================
     * 4. Client-Side Korean NLP Memo Parser (Offline AI 메모장)
     * ============================================================ */
    function parseKoreanScheduleMemo(noteText, referenceDate, timetableSchedule) {
      var refStr = DATE_RE.test(referenceDate) ? referenceDate : getTodayDateStr();
      var refParts = refStr.split('-').map(Number);
      var refDate = new Date(refParts[0], refParts[1] - 1, refParts[2]);
      var scheduleMap = {};
      var normSchedule = normalizeTimetableSchedule(timetableSchedule);
      normSchedule.forEach(function (r) { scheduleMap[r.period] = r; });

      var lines = String(noteText || '')
        .split(/\r?\n/)
        .map(function (l) { return l.replace(/^\s*(?:[-*•·]|\d+[.)])\s*/, '').trim(); })
        .filter(Boolean);

      var schedules = [];
      var ddays = [];
      var wdMap = { '일': 0, '월': 1, '화': 2, '수': 3, '목': 4, '금': 5, '토': 6 };

      function addDays(base, days) {
        var d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + days);
        return formatLocalDate(d);
      }

      function resolveDateFromLine(line) {
        var working = line;
        var found = refStr;
        var iso = /(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(working);
        if (iso) {
          var cand = iso[1] + '-' + String(Number(iso[2])).padStart(2, '0') + '-' + String(Number(iso[3])).padStart(2, '0');
          if (!validateDateString(cand)) {
            found = cand;
            working = working.replace(iso[0], ' ');
            return { date: found, rest: working };
          }
        }
        var mdKor = /(?:(\d{4})년\s*)?(\d{1,2})\s*월\s*(\d{1,2})\s*일/.exec(working);
        if (mdKor) {
          var yr = mdKor[1] ? Number(mdKor[1]) : refDate.getFullYear();
          var cand2 = yr + '-' + String(Number(mdKor[2])).padStart(2, '0') + '-' + String(Number(mdKor[3])).padStart(2, '0');
          if (!validateDateString(cand2)) {
            found = cand2;
            working = working.replace(mdKor[0], ' ');
            return { date: found, rest: working };
          }
        }
        var slash = /(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s|$)/.exec(working);
        if (slash) {
          var cand3 = refDate.getFullYear() + '-' + String(Number(slash[1])).padStart(2, '0') + '-' + String(Number(slash[2])).padStart(2, '0');
          if (!validateDateString(cand3)) {
            found = cand3;
            working = working.replace(slash[0], ' ');
            return { date: found, rest: working };
          }
        }
        var weekKw = /(이번\s*주|다음\s*주|다다음\s*주)\s*([일월화수목금토])요일/.exec(working);
        if (weekKw) {
          var targetWd = wdMap[weekKw[2]];
          var refWd = refDate.getDay();
          var diff = targetWd - refWd;
          if (/다음\s*주/.test(weekKw[1])) diff += 7;
          if (/다다음\s*주/.test(weekKw[1])) diff += 14;
          found = addDays(refDate, diff);
          working = working.replace(weekKw[0], ' ');
          return { date: found, rest: working };
        }
        if (/글피/.test(working)) {
          found = addDays(refDate, 3);
          working = working.replace(/글피(까지|에)?/, ' ');
          return { date: found, rest: working };
        }
        if (/모레/.test(working)) {
          found = addDays(refDate, 2);
          working = working.replace(/모레(까지|에)?/, ' ');
          return { date: found, rest: working };
        }
        if (/내일/.test(working)) {
          found = addDays(refDate, 1);
          working = working.replace(/내일(까지|에)?/, ' ');
          return { date: found, rest: working };
        }
        if (/오늘/.test(working)) {
          found = refStr;
          working = working.replace(/오늘(까지|에)?/, ' ');
          return { date: found, rest: working };
        }
        return { date: found, rest: working };
      }

      function to24h(ampm, h, m) {
        var hour = h;
        if ((ampm === '오후' || ampm === '저녁' || ampm === '밤') && hour < 12) hour += 12;
        if (ampm === '오전' && hour === 12) hour = 0;
        return String(Math.min(23, Math.max(0, hour))).padStart(2, '0') + ':' + String(Math.min(59, Math.max(0, m))).padStart(2, '0');
      }

      function resolveTimeFromLine(line) {
        var w = line;
        var startTime = '';
        var endTime = '';

        var periodMatch = /([1-7])\s*교시/.exec(w);
        if (periodMatch) {
          var pNum = Number(periodMatch[1]);
          var row = scheduleMap[pNum];
          if (row) {
            startTime = row.startTime;
            endTime = row.endTime;
          }
          w = w.replace(periodMatch[0], ' ');
          return { startTime: startTime, endTime: endTime, rest: w };
        }
        if (/점심\s*시간/.test(w)) {
          startTime = scheduleMap[0].startTime;
          endTime = scheduleMap[0].endTime;
          w = w.replace(/점심\s*시간(에)?/, ' ');
          return { startTime: startTime, endTime: endTime, rest: w };
        }
        if (/방과\s*후/.test(w)) {
          startTime = scheduleMap[8].startTime;
          endTime = scheduleMap[8].endTime;
          w = w.replace(/방과\s*후(에|까지)?/, ' ');
          return { startTime: startTime, endTime: endTime, rest: w };
        }
        if (/야자/.test(w)) {
          startTime = scheduleMap[9].startTime;
          endTime = scheduleMap[9].endTime;
          w = w.replace(/야자(\s*시간)?(에|까지)?/, ' ');
          return { startTime: startTime, endTime: endTime, rest: w };
        }

        var hhmmRange = /(\d{1,2}):(\d{2})\s*(?:~|-|부터)\s*(\d{1,2}):(\d{2})(?:\s*까지)?/.exec(w);
        if (hhmmRange) {
          startTime = to24h('', Number(hhmmRange[1]), Number(hhmmRange[2]));
          endTime = to24h('', Number(hhmmRange[3]), Number(hhmmRange[4]));
          w = w.replace(hhmmRange[0], ' ');
          return { startTime: startTime, endTime: endTime, rest: w };
        }

        var korRange = /(오전|오후|저녁|밤|새벽)?\s*(\d{1,2})\s*시(?:\s*(반)|(?:\s*(\d{1,2})\s*분))?\s*(?:부터|~|-)\s*(오전|오후|저녁|밤|새벽)?\s*(\d{1,2})\s*시(?:\s*(반)|(?:\s*(\d{1,2})\s*분))?(?:\s*까지)?/.exec(w);
        if (korRange) {
          var ap1 = korRange[1] || '';
          var m1 = korRange[3] ? 30 : (korRange[4] ? Number(korRange[4]) : 0);
          var ap2 = korRange[5] || ap1;
          var m2 = korRange[7] ? 30 : (korRange[8] ? Number(korRange[8]) : 0);
          startTime = to24h(ap1, Number(korRange[2]), m1);
          endTime = to24h(ap2, Number(korRange[6]), m2);
          w = w.replace(korRange[0], ' ');
          return { startTime: startTime, endTime: endTime, rest: w };
        }

        var korSingle = /(오전|오후|저녁|밤|새벽)?\s*(\d{1,2})\s*시(?:\s*(반)|(?:\s*(\d{1,2})\s*분))?(?:\s*(?:에|까지))?/.exec(w);
        if (korSingle) {
          var ap = korSingle[1] || '';
          var mm = korSingle[3] ? 30 : (korSingle[4] ? Number(korSingle[4]) : 0);
          startTime = to24h(ap, Number(korSingle[2]), mm);
          endTime = minutesToTime(timeToMinutes(startTime) + 60);
          w = w.replace(korSingle[0], ' ');
          return { startTime: startTime, endTime: endTime, rest: w };
        }

        var hhmmSingle = /\b(\d{1,2}):(\d{2})\b/.exec(w);
        if (hhmmSingle) {
          startTime = to24h('', Number(hhmmSingle[1]), Number(hhmmSingle[2]));
          endTime = minutesToTime(timeToMinutes(startTime) + 60);
          w = w.replace(hhmmSingle[0], ' ');
          return { startTime: startTime, endTime: endTime, rest: w };
        }

        return { startTime: '', endTime: '', rest: w };
      }

      var KNOWN_SUBJECTS = [
        '공통수학', '수학 I', '수학 II', '수학1', '수학2', '미적분', '확률과 통계', '기하', '수학',
        '물리학 I', '물리학', '화학 I', '화학', '생명과학', '지구과학', '통합과학', '과학',
        '영어 독해', '영어', '국어', '문학', '독서와 문법', '한국사', '통합사회', '사회', '정보', '미술', '음악', '체육'
      ];

      function extractSubject(text) {
        for (var i = 0; i < KNOWN_SUBJECTS.length; i++) {
          var sub = KNOWN_SUBJECTS[i];
          if (text.indexOf(sub) !== -1) {
            return sub;
          }
        }
        return '';
      }

      function cleanTitle(raw) {
        return raw
          .replace(/^(?:에|의|까지|부터)\s+/, '')
          .replace(/\s+/g, ' ')
          .replace(/(?:으로|로)?\s*(?:일정\s*)?(?:등록해줘|추가해줘|설정해줘|저장해줘|넣어줘|해줘)\s*$/g, '')
          .trim();
      }

      lines.forEach(function (line) {
        var dateRes = resolveDateFromLine(line);
        var isDDay = /(?:d\s*[- ]?\s*(?:day|데이)|dday|디\s*[- ]?\s*데이)/i.test(line);

        if (isDDay) {
          var dTitle = dateRes.rest
            .replace(/(?:d\s*[- ]?\s*(?:day|데이)|dday|디\s*[- ]?\s*데이)/gi, ' ')
            .replace(/(?:으로|로)?\s*(?:등록|추가|설정|저장)?\s*(?:해줘|하기|해)?\s*$/g, '')
            .replace(/\s+/g, ' ')
            .trim();
          var cat = '목표';
          if (/시험|고사|모의고사|수능/.test(line)) cat = '시험';
          else if (/수행평가/.test(line)) cat = '수행평가';
          else if (/과제|숙제|제출/.test(line)) cat = '과제';
          else if (/독서|책/.test(line)) cat = '독서';

          ddays.push({
            title: dTitle || '새 D-Day',
            targetDate: dateRes.date,
            category: cat,
            pinned: true
          });
          return;
        }

        var timeRes = resolveTimeFromLine(dateRes.rest);
        var subject = extractSubject(line);
        var titleText = cleanTitle(timeRes.rest);
        if (subject && titleText.indexOf(subject) === 0) {
          var withoutSub = titleText.slice(subject.length).replace(/^(?:의|은|는|이|가)?\s*/, '').trim();
          if (withoutSub) titleText = withoutSub;
        }
        if (!titleText) titleText = line;

        var goalMatch = /(\d+\s*(?:문항|문제|페이지|쪽|단원|강|개|단어|장))/.exec(line);
        var goal = goalMatch ? goalMatch[1] : '';

        var isStudyVerb = /공부|기출|오답|복습|예습|암기|독서|책\s*읽|읽기|자습|영단어|문제\s*풀|풀기|코딩/.test(line);
        var isSchoolEvent = /수행평가|과제|숙제|제출|학교|중간고사|기말고사|모의고사|시험(?!\s*공부)/.test(line) && !isStudyVerb;

        if (isSchoolEvent) {
          var kind = 'assignment';
          if (/수행평가|발표|실험\s*보고서/.test(line)) kind = 'assessment';
          else if (/시험|고사|모의고사|쪽지시험/.test(line)) kind = 'exam';
          schedules.push({
            scheduleGroup: 'school',
            schoolKind: kind,
            studyCategory: 'other',
            subject: subject || '학교',
            title: titleText,
            date: dateRes.date,
            startTime: timeRes.startTime,
            endTime: timeRes.endTime,
            goal: '',
            notes: ''
          });
        } else if (isStudyVerb || subject) {
          var sCat = 'other';
          if (/독서|책|코스모스|소설|읽기|독후감/.test(line)) sCat = 'reading';
          else if (/시험|기출|모의고사|기말|중간|오답|단원|복습|공부/.test(line)) sCat = 'exam_prep';

          var bookMatch = /['"《『]([^'"》』]+)['"》』]/.exec(line);
          var subjOrBook = bookMatch ? bookMatch[1] : subject;
          schedules.push({
            scheduleGroup: 'study',
            schoolKind: 'assignment',
            studyCategory: sCat,
            subject: subjOrBook,
            title: titleText,
            date: dateRes.date,
            startTime: timeRes.startTime,
            endTime: timeRes.endTime,
            goal: goal,
            notes: ''
          });
        } else {
          schedules.push({
            scheduleGroup: 'general',
            schoolKind: 'assignment',
            studyCategory: 'other',
            subject: '',
            title: titleText,
            date: dateRes.date,
            startTime: timeRes.startTime,
            endTime: timeRes.endTime,
            goal: '',
            notes: ''
          });
        }
      });

      return { schedules: schedules, ddays: ddays };
    }

            '</button>' +

    function renderStudyView(planner) {
      var cats = [
        { id: 'exam_prep', label: '시험공부', desc: '교과 복습, 기출 풀이, 오답 정리' },
        { id: 'reading', label: '독서', desc: '교양·전공 도서 읽기 및 독서 기록' },
        { id: 'other', label: '기타 공부', desc: '영단어, 코딩, 자격증, 자율 학습' }
      ];
      var stats = { exam_prep: { total: 0, done: 0 }, reading: { total: 0, done: 0 }, other: { total: 0, done: 0 } };
      planner.studyItems.forEach(function (it) {
        if (!stats[it.category]) return;
        stats[it.category].total += 1;
        if (it.completed) stats[it.category].done += 1;
      });
      var visibleCats = STATE.studyTab === 'all' ? cats : cats.filter(function (c) { return c.id === STATE.studyTab; });

      return (
        '<div style="display:flex;flex-direction:column;gap:28px;">' +
          '<div class="page-head" style="margin-bottom:0;">' +
            '<div>' +
              '<h1 class="page-title">공부 일정</h1>' +
              '<p class="page-sub">시험공부, 독서, 기타 공부를 목적별로 나누어 계획하고 완료 여부를 체크하세요.</p>' +
            '</div>' +
            '<button type="button" data-action="open-new-sched" data-group="study" data-study-cat="' + (STATE.studyTab === 'all' ? 'exam_prep' : STATE.studyTab) + '" class="btn btn-primary">' +
              icon('plus', 14) + '<span>공부 일정 추가</span>' +
            '</button>' +
          '</div>' +
          '<div class="grid-3">' +
            cats.map(function (c) {
              var st = stats[c.id];
              var act = STATE.studyTab === c.id;
              return '<button type="button" data-action="study-tab" data-tab="' + c.id + '" class="card" style="padding:16px;text-align:left;background:' + (act ? '#f5f9fe' : 'var(--bg-subtle)') + ';border-color:' + (act ? 'var(--blue)' : 'var(--border)') + ';">' +
                '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">' +
                  '<span style="font-size:14px;font-weight:600;">' + c.label + '</span>' +
                  '<span class="mono" style="font-size:12px;font-weight:600;color:var(--green);">' + st.done + '/' + st.total + ' 완료</span>' +
                '</div>' +
                '<p style="font-size:12px;color:var(--text-muted);margin:4px 0 0;">' + c.desc + '</p>' +
              '</button>';
            }).join('') +
          '</div>' +
          '<div style="padding-bottom:8px;border-bottom:1px solid var(--border);">' +
            '<div role="tablist" aria-label="공부 일정 카테고리 필터" class="seg-tabs-inline">' +
              '<button type="button" role="tab" aria-selected="' + (STATE.studyTab === 'all') + '" data-action="study-tab" data-tab="all" class="seg-tab ' + (STATE.studyTab === 'all' ? 'active' : '') + '">전체 보기</button>' +
              cats.map(function (c) {
                var act = STATE.studyTab === c.id;
                return '<button type="button" role="tab" aria-selected="' + act + '" data-action="study-tab" data-tab="' + c.id + '" class="seg-tab ' + (act ? 'active' : '') + '">' + c.label + '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:28px;">' +
            visibleCats.map(function (c) {
              var items = planner.studyItems
                .filter(function (i) { return i.category === c.id; })
                .sort(function (a, b) { return a.date.localeCompare(b.date) || (a.startTime || '').localeCompare(b.startTime || ''); });
              return '<section aria-labelledby="study-sec-' + c.id + '">' +
                '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;">' +
                  '<div style="display:flex;align-items:baseline;gap:8px;">' +
                    '<h2 id="study-sec-' + c.id + '" style="font-size:16px;font-weight:600;margin:0;">' + c.label + '</h2>' +
                    '<span class="tabular" style="font-size:12px;color:var(--text-muted);">' + items.length + '건</span>' +
                  '</div>' +
                  '<button type="button" data-action="open-new-sched" data-group="study" data-study-cat="' + c.id + '" class="btn btn-secondary" style="padding:4px 10px;">' +
                    icon('plus', 12) + '<span>' + c.label + ' 추가</span>' +
                  '</button>' +
                '</div>' +
                (items.length === 0
                  ? '<div class="card" style="background:var(--bg-subtle);padding:28px 16px;text-align:center;">' +
                      '<p style="font-size:12px;color:var(--text-muted);margin:0 0 8px;">아직 등록된 ' + c.label + ' 일정이 없습니다.</p>' +
                      '<button type="button" data-action="open-new-sched" data-group="study" data-study-cat="' + c.id + '" class="btn btn-secondary">' + icon('plus', 12, 'color:var(--blue);') + '<span>첫 ' + c.label + ' 등록하기</span></button>' +
                    '</div>'
                  : '<div class="card" style="overflow:hidden;">' +
                      items.map(function (it, idx) {
                        return '<div style="padding:12px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;' + (idx > 0 ? 'border-top:1px solid var(--border);' : '') + '">' +
                          '<button type="button" data-action="study-toggle" data-id="' + esc(it.id) + '" aria-label="' + esc(it.title) + ' 완료 전환" style="display:flex;align-items:flex-start;gap:12px;text-align:left;min-width:0;flex:1;">' +
                            icon(it.completed ? 'checkSq' : 'sq', 16, 'margin-top:2px;flex-shrink:0;color:' + (it.completed ? 'var(--green)' : 'var(--text-faint)') + ';') +
                            '<div style="min-width:0;">' +
                              '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;">' +
                                (it.subjectOrBook ? '<span style="font-size:12px;font-weight:600;color:var(--green);">' + esc(it.subjectOrBook) + '</span><span style="font-size:12px;color:var(--text-faint);" aria-hidden="true">·</span>' : '') +
                                '<span style="font-size:14px;font-weight:500;' + (it.completed ? 'text-decoration:line-through;color:var(--text-faint);' : '') + '">' + esc(it.title) + '</span>' +
                              '</div>' +
                              '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--text-muted);">' +
                                '<span class="tabular">' + formatKoreanDateFull(it.date) + '</span>' +
                                '<span aria-hidden="true">·</span>' +
                                '<span class="mono">' + esc(formatScheduleTimeRange(it.startTime, it.endTime)) + '</span>' +
                                (it.goal ? '<span aria-hidden="true">·</span><span>목표: ' + esc(it.goal) + '</span>' : '') +
                              '</div>' +
                              (it.notes ? '<p style="font-size:12px;color:var(--text-muted);margin:4px 0 0;">' + esc(it.notes) + '</p>' : '') +
                            '</div>' +
                          '</button>' +
                          '<div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">' +
                            '<button type="button" data-action="edit-study" data-id="' + esc(it.id) + '" aria-label="공부 일정 수정: ' + esc(it.title) + '" class="icon-btn edit">' + icon('pencil', 15) + '</button>' +
                            '<button type="button" data-action="del-study" data-id="' + esc(it.id) + '" aria-label="공부 일정 삭제: ' + esc(it.title) + '" class="icon-btn del">' + icon('trash', 15) + '</button>' +
                          '</div>' +
                        '</div>';
                      }).join('') +
                    '</div>') +
              '</section>';
            }).join('') +
          '</div>' +
        '</div>'
      );
    }

    function renderDDayView(planner) {
      var todayStr = getTodayDateStr();
      var sorted = sortDDaysByProximity(planner.ddays, todayStr);
      var f = STATE.ddayForm;

          '<div>' +
            '<h1 class="page-title">D-Day 관리</h1>' +
            '<p class="page-sub">중요한 시험일, 과제 마감일, 목표 날짜를 등록하면 사이드바와 캘린더에 함께 표시됩니다.</p>' +
          '</div>' +
          '<form id="dday-add-form" class="card" style="background:var(--bg-subtle);padding:20px;display:flex;flex-direction:column;gap:14px;">' +

              '<div style="grid-column:span 2 / auto;">' +
                '<label for="dday-title" class="field-label">목표 이름</label>' +
                '<input id="dday-title" type="text" value="' + esc(f.title) + '" placeholder="예: 2학기 기말고사, 모의고사" class="input" style="background:#fff;" />' +
              '</div>' +
              '<div>' +
                '<label for="dday-date" class="field-label">목표 날짜</label>' +
                '<input id="dday-date" type="date" value="' + esc(f.targetDate) + '" class="input tabular" style="background:#fff;" />' +
              '</div>' +
              '<div>' +
                '<label for="dday-category" class="field-label">구분</label>' +
                '<select id="dday-category" class="select" style="background:#fff;">' +
                  DD_CATEGORIES.map(function (c) {

              '</div>' +

                '<input id="dday-pinned" type="checkbox"' + (f.pinned ? ' checked' : '') + ' />' +

              (f.error ? '<p role="alert" style="margin:0;font-size:12px;color:var(--red);">' + esc(f.error) + '</p>' : '') +

          '</form>' +
          (sorted.length === 0

                  var st = calculateDDay(d.targetDate, todayStr);
                  var badgeBg = st.isToday ? 'var(--red-soft)' : st.isPast ? 'var(--bg-sidebar)' : st.diffDays <= 7 ? 'var(--orange-soft)' : 'var(--blue-soft)';
                  var badgeCol = st.isToday ? 'var(--red)' : st.isPast ? 'var(--text-faint)' : st.diffDays <= 7 ? 'var(--orange)' : 'var(--blue)';

                    '<div style="min-width:0;">' +
                      '<div style="display:flex;align-items:center;gap:8px;">' +
                        '<span style="font-size:14px;font-weight:600;">' + esc(d.title) + '</span>' +
                        '<span aria-hidden="true" style="color:var(--text-muted);">·</span>' +
                        '<span style="font-size:12px;color:var(--text-muted);">' + esc(d.category) + '</span>' +
                      '</div>' +
                      '<div class="tabular" style="font-size:12px;color:var(--text-muted);margin-top:3px;">목표일: ' + formatKoreanDateFull(d.targetDate) + '</div>' +
                    '</div>' +
                    '<div style="display:flex;align-items:center;gap:10px;">' +
                      '<span class="mono" style="font-size:15px;font-weight:700;padding:4px 10px;border-radius:4px;background:' + badgeBg + ';color:' + badgeCol + ';">' + esc(st.label) + '</span>' +
                      '<button type="button" data-action="edit-dday" data-id="' + esc(d.id) + '" aria-label="D-Day 수정: ' + esc(d.title) + '" class="icon-btn edit">' + icon('pencil', 15) + '</button>' +
                      '<button type="button" data-action="toggle-dday-pin" data-id="' + esc(d.id) + '" aria-label="' + esc(d.title) + (d.pinned ? ' 사이드바 고정 해제' : ' 사이드바 고정') + '" aria-pressed="' + d.pinned + '" style="padding:6px;border-radius:4px;border:1px solid ' + (d.pinned ? 'var(--blue-border)' : 'var(--border)') + ';background:' + (d.pinned ? 'var(--blue-soft)' : '#fff') + ';color:' + (d.pinned ? 'var(--blue)' : 'var(--text-faint)') + ';">' + icon('pin', 14) + '</button>' +
                      '<button type="button" data-action="del-dday" data-id="' + esc(d.id) + '" aria-label="D-Day 삭제: ' + esc(d.title) + '" class="icon-btn del">' + icon('trash', 15) + '</button>' +
                    '</div>' +
                  '</div>';
                }).join('') +
              '</div>') +
        '</div>'
      );

    function renderAdminTableMarkup(me, impUser) {
      var q = STATE.adminSearch.trim().toLowerCase();
      var list = DB.users.filter(function (u) {
        if (!q) return true;
        return u.username.toLowerCase().indexOf(q) !== -1 || u.displayName.toLowerCase().indexOf(q) !== -1;
      });
      if (list.length === 0) {
        return '<tr><td colspan="5" style="padding:36px 16px;text-align:center;color:var(--text-muted);">조건에 맞는 사용자 계정이 없습니다.</td></tr>';
      }
      return list.map(function (u) {
        var pl = getPlannerForUser(u.id);
        var isSelf = u.id === me.id;
        var isPrimary = isPrimaryAdminUsername(u.username);
        var delErr = canAdminDeleteUser(me.id, u);
        var isImp = impUser && impUser.id === u.id;
        var joined = u.createdAt ? u.createdAt.slice(0, 10) : '-';
        var isConfirm = STATE.adminConfirmDeleteId === u.id;
        return '<tr style="' + (isImp ? 'background:#f5f9fe;' : '') + '">' +
          '<td>' +
            '<div style="display:flex;align-items:center;gap:10px;min-width:0;">' +
              '<span style="width:28px;height:28px;border-radius:4px;background:var(--bg-hover);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;">' + esc(u.displayName.slice(0, 1)) + '</span>' +
              '<div style="min-width:0;">' +
                '<div style="display:flex;align-items:center;gap:6px;font-weight:500;">' +
                  '<span class="truncate">' + esc(u.displayName) + '</span>' +
                  (isSelf ? '<span style="font-size:11px;color:var(--blue);font-weight:400;">· 나</span>' : '') +
                  (isPrimary ? '<span style="font-size:11px;color:var(--text-muted);font-weight:400;">· 기본 관리자</span>' : '') +
                '</div>' +
                '<div class="mono" style="font-size:11px;color:var(--text-muted);">@' + esc(u.username) + '</div>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td style="white-space:nowrap;"><span style="font-size:12px;font-weight:500;color:' + (u.role === 'admin' ? 'var(--blue)' : 'var(--text-secondary)') + ';">' + (u.role === 'admin' ? '관리자 (전체 권한)' : '일반 사용자') + '</span></td>' +
          '<td class="tabular" style="font-size:11px;color:var(--text-secondary);white-space:nowrap;">일반 ' + pl.events.length + ' · 학교 ' + pl.schoolItems.length + ' · 공부 ' + pl.studyItems.length + ' · D-Day ' + pl.ddays.length + ' · 시간표 ' + pl.timetable.length + '</td>' +
          '<td class="mono" style="font-size:11px;color:var(--text-muted);white-space:nowrap;">' + esc(joined) + '</td>' +
          '<td style="text-align:right;white-space:nowrap;">' +
            '<div style="display:inline-flex;align-items:center;gap:6px;">' +
              '<button type="button" data-action="admin-edit" data-id="' + esc(u.id) + '" aria-label="' + esc(u.username) + ' 정보 수정" class="btn btn-secondary">' + icon('pencil', 12, 'color:var(--text-muted);') + '<span>정보 수정</span></button>' +
              (!isSelf
                ? '<button type="button" data-action="admin-imp" data-id="' + esc(u.id) + '" aria-label="' + esc(u.username) + ' 플래너 관리" class="btn ' + (isImp ? 'btn-primary' : 'btn-soft-blue') + '">' + icon('folder', 12) + '<span>' + (isImp ? '관리 중' : '플래너 관리') + '</span></button>'
                : '') +
              (isConfirm
                ? '<button type="button" data-action="admin-del-confirm" data-id="' + esc(u.id) + '" aria-label="' + esc(u.username) + ' 삭제 확인" class="btn btn-danger">삭제 확인</button>' +
                  '<button type="button" data-action="admin-del-cancel" class="btn btn-subtle">취소</button>'
                : '<button type="button" data-action="admin-del-ask" data-id="' + esc(u.id) + '"' + (delErr ? ' disabled title="' + esc(delErr) + '"' : ' title="' + esc(u.username) + ' 계정 삭제"') + ' aria-label="' + esc(u.username) + ' 삭제" class="icon-btn del">' + icon('trash', 14) + '</button>') +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

            '<div>' +
              '<div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:4px;">' + icon('shield', 14, 'color:var(--blue);') + '<span>전체 권한 관리자 워크스페이스</span></div>' +

          (STATE.adminError ? '<div role="alert" class="alert-err">' + esc(STATE.adminError) + '</div>' : '') +
          '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">' +
            '<div class="input-icon-wrap" style="flex:1;max-width:340px;">' +
              icon('search', 14) +
              '<input id="admin-search-input" type="search" value="' + esc(STATE.adminSearch) + '" placeholder="아이디 또는 닉네임 검색..." aria-label="사용자 검색" class="input input-sm" style="background:#fff;" />' +
